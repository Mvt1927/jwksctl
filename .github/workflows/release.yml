name: Release & Publish Binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build & Release Standalone Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes and Update CHANGELOG.md
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          TODAY=$(date +'%Y-%m-%d')

          # 1. Tạo nội dung cho GitHub Release Notes (hiển thị trên trang Release của tag này)
          echo "## Release ${{ github.ref_name }} ($TODAY)" > release_notes.md
          echo "" >> release_notes.md
          echo "### 🚀 What's Changed" >> release_notes.md
          echo "" >> release_notes.md
          if [ -z "$PREV_TAG" ]; then
            git log "${{ github.ref_name }}" --pretty=format:"* %s (%h) by @%an" --reverse >> release_notes.md
          else
            git log "$PREV_TAG..${{ github.ref_name }}" --pretty=format:"* %s (%h) by @%an" --reverse >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "### 📦 Quick Install (Linux / macOS)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo 'curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash' >> release_notes.md
          echo '```' >> release_notes.md

          # 2. Tự động chèn mục Release này vào đầu file CHANGELOG.md trong repository
          cat release_notes.md > new_entry.txt
          echo "" >> new_entry.txt
          echo "---" >> new_entry.txt
          echo "" >> new_entry.txt

          if [ -f CHANGELOG.md ]; then
            # Chèn sau tiêu đề header của CHANGELOG.md
            awk 'NR==6{print ""; system("cat new_entry.txt")}1' CHANGELOG.md > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
          else
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            cat new_entry.txt >> CHANGELOG.md
          fi
          rm -f new_entry.txt

          # 3. Commit và push file CHANGELOG.md đã cập nhật trở lại nhánh main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): cap nhat changelog cho phien ban ${{ github.ref_name }} [skip ci]" || echo "No changelog changes to commit"
          git push origin HEAD:main || echo "Unable to push changelog to main, continuing release..."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests
        run: bun test

      - name: Build Standalone Binaries
        run: |
          mkdir -p dist
          bun run build:linux-x64
          bun run build:linux-arm64
          bun run build:windows-x64
          bun run build:darwin-x64
          bun run build:darwin-arm64

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum jwksctl-* > SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/jwksctl-linux-x64
            dist/jwksctl-linux-arm64
            dist/jwksctl-windows-x64.exe
            dist/jwksctl-darwin-x64
            dist/jwksctl-darwin-arm64
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
