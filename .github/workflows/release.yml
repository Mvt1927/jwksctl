name: Release & Publish Binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build & Release Standalone Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog from Git Commits
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          echo "### 🚀 What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          if [ -z "$PREV_TAG" ]; then
            echo "Listing all commits up to ${{ github.ref_name }}:"
            git log "${{ github.ref_name }}" --pretty=format:"* %s (%h) by @%an" --reverse >> CHANGELOG.md
          else
            echo "Listing commits from $PREV_TAG to ${{ github.ref_name }}:"
            git log "$PREV_TAG..${{ github.ref_name }}" --pretty=format:"* %s (%h) by @%an" --reverse >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md
          echo "---" >> CHANGELOG.md
          echo "### 📦 Quick Install (Linux / macOS)" >> CHANGELOG.md
          echo '```bash' >> CHANGELOG.md
          echo 'curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash' >> CHANGELOG.md
          echo '```' >> CHANGELOG.md

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests
        run: bun test

      - name: Build Standalone Binaries
        run: |
          mkdir -p dist
          bun run build:linux-x64
          bun run build:linux-arm64
          bun run build:windows-x64
          bun run build:darwin-x64
          bun run build:darwin-arm64

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum jwksctl-* > SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            dist/jwksctl-linux-x64
            dist/jwksctl-linux-arm64
            dist/jwksctl-windows-x64.exe
            dist/jwksctl-darwin-x64
            dist/jwksctl-darwin-arm64
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
